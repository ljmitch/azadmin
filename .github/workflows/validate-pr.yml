name: Validate toolbox

on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - config/powershell/**
      - .dockerignore
      - .github/**
  push:
    branches-ignore: [main]
    paths:
      - Dockerfile
      - scripts/**
      - config/powershell/**
      - .dockerignore
      - .github/**
  workflow_dispatch:
    inputs:
      cache_bust:
        description: Re-resolve floating tools instead of reusing installed-tool layers
        type: boolean
        default: true
  workflow_call:
    inputs:
      cache_bust:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: toolbox-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  build-verify-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache-bust stamp
        id: bust
        env:
          CACHE_BUST: ${{ inputs.cache_bust || false }}
        run: |
          stamp=unknown
          if [ "$CACHE_BUST" = true ]; then stamp="$(date -u +%Y%m%d%H%M%S)"; fi
          printf 'build_date=%s\n' "$stamp" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build, verify and scan all profiles
        uses: ./.github/actions/validate-toolbox
        with:
          base-image: ${{ vars.BASE_IMAGE || 'ubuntu:24.04' }}
          dotnet-sdk-image: ${{ vars.DOTNET_SDK_IMAGE || 'mcr.microsoft.com/dotnet/sdk:10.0-noble' }}
          build-date: ${{ steps.bust.outputs.build_date }}
          tool-versions: ${{ vars.TOOLBOX_TOOL_VERSIONS }}
          betterleaks-version: ${{ vars.BETTERLEAKS_VERSION || 'latest' }}
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: toolbox-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
