name: Build and push to GHCR

on:
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - config/powershell/**
      - .dockerignore
      - .github/**
  workflow_dispatch:
    inputs:
      cache_bust:
        description: Re-resolve floating tools with a new build stamp
        type: boolean
        default: true
      publish:
        description: Publish all passing profiles to GHCR (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ghcr-build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  validate-only:
    if: github.event_name == 'workflow_dispatch' && (github.ref != 'refs/heads/main' || !inputs.publish)
    uses: ./.github/workflows/validate-pr.yml
    with:
      cache_bust: ${{ inputs.cache_bust }}
    permissions:
      contents: read
  build-and-push:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache-bust stamp
        id: bust
        env:
          EVENT_NAME: ${{ github.event_name }}
          CACHE_BUST: ${{ inputs.cache_bust || false }}
        run: |
          stamp=unknown
          if [ "$EVENT_NAME" = schedule ] || [ "$CACHE_BUST" = true ]; then
            stamp="$(date -u +%Y%m%d%H%M%S)"
          fi
          printf 'build_date=%s\n' "$stamp" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build, verify and scan all profiles
        uses: ./.github/actions/validate-toolbox
        with:
          base-image: ${{ vars.BASE_IMAGE || 'ubuntu:24.04' }}
          dotnet-sdk-image: ${{ vars.DOTNET_SDK_IMAGE || 'mcr.microsoft.com/dotnet/sdk:10.0-noble' }}
          build-date: ${{ steps.bust.outputs.build_date }}
          tool-versions: ${{ vars.TOOLBOX_TOOL_VERSIONS }}
          betterleaks-version: ${{ vars.BETTERLEAKS_VERSION || 'latest' }}
          export-cache: "true"
      - name: Log in to GHCR after all gates pass
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified local image IDs
        run: bash .github/scripts/publish-images.sh
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: toolbox-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
