name: Build, verify and scan toolbox profiles
description: Validate the loaded core, dotnet and functions images before publication.
inputs:
  base-image:
    description: Reviewed Ubuntu base reference
    required: true
  dotnet-sdk-image:
    description: Reviewed .NET SDK source reference
    required: true
  build-date:
    description: Cache-bust stamp for floating tools
    default: unknown
  tool-versions:
    description: Optional Dockerfile tool-version overrides, one NAME=VALUE per line
    default: ""
  betterleaks-version:
    description: Betterleaks stable release selector
    default: latest
  image-findings-policy:
    description: Warn on image findings in validation or block them before publication
    default: block
  export-cache:
    description: Only trusted publication runs may update the shared build cache
    default: "false"
runs:
  using: composite
  steps:
    - name: Scan Git history with Betterleaks
      shell: bash
      env:
        BETTERLEAKS_VERSION: ${{ inputs.betterleaks-version }}
      run: bash .github/scripts/scan-history.sh
    - name: Validate tool version overrides
      id: versions
      shell: bash
      env:
        TOOL_VERSIONS: ${{ inputs.tool-versions }}
      run: |
        mkdir -p reports
        allowed="$(sed -nE 's/^ARG ([A-Z_]+_VERSION)=latest$/\1/p' Dockerfile)"
        declare -A seen=()
        : > reports/requested-tool-versions.txt
        while IFS= read -r line; do
          line="${line%$'\r'}"
          [[ -n "$line" ]] || continue
          if [[ ! "$line" =~ ^([A-Z_]+_VERSION)=[a-zA-Z0-9][a-zA-Z0-9.+:~_\-]*$ ]]; then
            echo 'Use NAME=VERSION, one per line, for toolbox version overrides.' >&2
            exit 2
          fi
          name="${BASH_REMATCH[1]}"
          if ! grep -Fxq -- "$name" <<< "$allowed" || [[ -v 'seen[$name]' ]]; then
            printf 'Unsupported or repeated tool version selector: %s\n' "$name" >&2
            exit 2
          fi
          seen[$name]=1
          printf '%s\n' "$line" >> reports/requested-tool-versions.txt
        done <<< "$TOOL_VERSIONS"
        {
          echo 'build-args<<END_TOOL_VERSIONS'
          cat reports/requested-tool-versions.txt
          echo END_TOOL_VERSIONS
        } >> "$GITHUB_OUTPUT"
    - name: Test scan policy
      shell: bash
      run: bash .github/scripts/test-scan-policy.sh
    - name: Install Trivy
      shell: bash
      run: |
        mkdir -p reports/core reports/dotnet reports/functions
        printf 'TRIVY_CACHE_DIR=%s/azadmin-trivy-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        bash .github/scripts/install-trivy.sh
    - name: Scan checkout for secrets with Trivy
      shell: bash
      run: bash .github/scripts/scan-source.sh
    - name: Build core
      id: core_build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        platforms: linux/amd64
        pull: true
        load: true
        push: false
        provenance: false
        tags: admin-toolbox:core
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image }}
          DOTNET_SDK_IMAGE=${{ inputs.dotnet-sdk-image }}
          BUILD_DATE=${{ inputs.build-date }}
          TOOLBOX_PROFILE=core
          ${{ steps.versions.outputs.build-args }}
        cache-from: type=gha,scope=toolbox-profiles
    - name: Smoke test core
      id: core_verify
      continue-on-error: true
      shell: bash
      env:
        BUILD_METADATA: ${{ steps.core_build.outputs.metadata }}
      run: |
        printf '%s\n' "$BUILD_METADATA" > reports/core/build-metadata.json
        bash scripts/test-image.sh admin-toolbox:core core reports/core
    - name: Scan core image with Trivy
      id: core_scan
      continue-on-error: true
      shell: bash
      env:
        IMAGE_FINDINGS_POLICY: ${{ inputs.image-findings-policy }}
      run: bash scripts/scan-image.sh admin-toolbox:core reports/core
    - name: Build dotnet
      id: dotnet_build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        platforms: linux/amd64
        pull: true
        load: true
        push: false
        provenance: false
        tags: admin-toolbox:dotnet
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image }}
          DOTNET_SDK_IMAGE=${{ inputs.dotnet-sdk-image }}
          BUILD_DATE=${{ inputs.build-date }}
          TOOLBOX_PROFILE=dotnet
          ${{ steps.versions.outputs.build-args }}
        cache-from: type=gha,scope=toolbox-profiles
    - name: Smoke test dotnet
      id: dotnet_verify
      continue-on-error: true
      shell: bash
      env:
        BUILD_METADATA: ${{ steps.dotnet_build.outputs.metadata }}
      run: |
        printf '%s\n' "$BUILD_METADATA" > reports/dotnet/build-metadata.json
        bash scripts/test-image.sh admin-toolbox:dotnet dotnet reports/dotnet
    - name: Scan dotnet image with Trivy
      id: dotnet_scan
      continue-on-error: true
      shell: bash
      env:
        IMAGE_FINDINGS_POLICY: ${{ inputs.image-findings-policy }}
      run: bash scripts/scan-image.sh admin-toolbox:dotnet reports/dotnet
    - name: Build functions
      id: functions_build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        platforms: linux/amd64
        pull: true
        load: true
        push: false
        provenance: false
        tags: admin-toolbox:functions
        labels: org.opencontainers.image.revision=${{ github.sha }}
        build-args: |
          BASE_IMAGE=${{ inputs.base-image }}
          DOTNET_SDK_IMAGE=${{ inputs.dotnet-sdk-image }}
          BUILD_DATE=${{ inputs.build-date }}
          TOOLBOX_PROFILE=functions
          ${{ steps.versions.outputs.build-args }}
        cache-from: type=gha,scope=toolbox-profiles
        cache-to: ${{ inputs.export-cache == 'true' && 'type=gha,scope=toolbox-profiles,mode=max' || '' }}
    - name: Smoke test functions
      id: functions_verify
      continue-on-error: true
      shell: bash
      env:
        BUILD_METADATA: ${{ steps.functions_build.outputs.metadata }}
      run: |
        printf '%s\n' "$BUILD_METADATA" > reports/functions/build-metadata.json
        bash scripts/test-image.sh admin-toolbox:functions functions reports/functions
    - name: Scan functions image with Trivy
      id: functions_scan
      continue-on-error: true
      shell: bash
      env:
        IMAGE_FINDINGS_POLICY: ${{ inputs.image-findings-policy }}
      run: bash scripts/scan-image.sh admin-toolbox:functions reports/functions
    - name: Summarize and enforce validation
      if: ${{ !cancelled() }}
      shell: bash
      env:
        CORE_VERIFY: ${{ steps.core_verify.outcome }}
        DOTNET_VERIFY: ${{ steps.dotnet_verify.outcome }}
        FUNCTIONS_VERIFY: ${{ steps.functions_verify.outcome }}
        CORE_SCAN: ${{ steps.core_scan.outcome }}
        DOTNET_SCAN: ${{ steps.dotnet_scan.outcome }}
        FUNCTIONS_SCAN: ${{ steps.functions_scan.outcome }}
      run: |
        passed=true
        {
          printf '## Toolbox validation\n\n| Profile | Smoke test | Image scan step | Image findings | HIGH/CRITICAL | Secret matches | EOL |\n|---|---|---|---|---:|---:|---|\n'
          for profile in core dotnet functions; do
            verify_key="${profile^^}_VERIFY"
            scan_key="${profile^^}_SCAN"
            verify="${!verify_key:-skipped}"
            scan="${!scan_key:-skipped}"
            if [[ "$verify" != success || "$scan" != success ]]; then passed=false; fi
            if [ -f "reports/${profile}/scan-summary.json" ]; then
              jq -r --arg profile "$profile" --arg verify "$verify" --arg scan "$scan" \
                '"| " + ([$profile, $verify, $scan, .policy_result, .blocking_vulnerabilities, .secret_findings, .eol_os] | map(tostring) | join(" | ")) + " |"' \
                "reports/${profile}/scan-summary.json"
            else
              printf '| %s | %s | %s | unavailable | unavailable | unavailable | unavailable |\n' "$profile" "$verify" "$scan"
              passed=false
            fi
          done
        } >> "$GITHUB_STEP_SUMMARY"
        [[ "$passed" == true ]]
